:root{

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;fill:currentColor;flex:none}
.muted{color:var(--muted)}
.pad{padding:12px 0}

#app{display:grid;height:100%;height:100dvh;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"side top" "side main" "bar bar"}

/* sidebar */
#side{grid-area:side;background:var(--panel);display:flex;flex-direction:column;gap:4px;padding:20px 12px 14px;min-height:0;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.03em;padding:0 10px 16px}
.disc{width:28px;height:28px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--accent) 0 20%,#0d0a14 21% 34%,#241d3d 35% 38%,#0d0a14 39% 100%)}
.nav{display:flex;align-items:center;gap:14px;width:100%;padding:10px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:600;text-align:left;cursor:pointer;min-width:0}
.nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover{color:var(--fg)}
.nav.on{color:var(--fg);background:var(--panel2)}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#plList{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#plList .nav{padding:7px 10px;gap:12px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
#side .primary{margin-top:10px}

/* covers */
.cover{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;width:100%;min-width:0;color:rgba(255,255,255,.92);font-weight:800;font-size:30px;background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 55) 70% 32%))}
.cover.sm{width:44px;font-size:17px;border-radius:6px;flex:none}
.cover.xs{width:26px;font-size:12px;border-radius:5px;flex:none}
.cover.ph{background:var(--panel2)}
.cover.likedc{background:linear-gradient(135deg,#7b5cff,#e85dc8)}
.cover.likedc svg{width:42%;height:42%}

/* main */
#main{grid-area:main;overflow-y:auto;padding:6px 32px 36px;min-width:0}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;font-weight:800;letter-spacing:-.035em;margin:0 0 18px;text-wrap:balance}
h2{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0 0 12px}
section{margin-bottom:30px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h1,.sec-h h2{margin:0}
.count{color:var(--muted);font-weight:500;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:0;border-radius:10px;padding:12px;text-align:left;cursor:pointer;min-width:0}
.card:hover{background:var(--panel2)}
.card .cover{margin-bottom:8px}
.card b,.meta b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.card small,.meta small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:13px}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.ghost:hover{border-color:var(--fg)}
.ghost svg{width:18px;height:18px}
.ghost.danger{color:var(--danger)}

/* track rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:36px 44px minmax(0,1fr) auto 48px auto;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 56px}
.row:hover{background:var(--panel)}
.idx{display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums;height:24px}
.idx .pl,.idx .eq{display:none}
.idx .pl svg{width:20px;height:20px;fill:var(--fg)}
.row:hover .idx .n{display:none}
.row:hover .idx .pl{display:block}
.row.cur .idx .n{display:none}
.row.cur .idx .eq{display:inline-flex}
.row.cur:hover .idx .eq{display:none}
.row.cur .meta b{color:var(--accent)}
.eq{gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:100%;background:var(--accent);border-radius:1px;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.4s}
.eq i:nth-child(3){animation-delay:-.7s}
.is-playing .eq i{animation-play-state:running}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.dur{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.icon{background:none;border:0;color:var(--muted);width:38px;height:38px;display:grid;place-items:center;border-radius:50%;cursor:pointer;padding:0;position:relative}
.icon:hover{color:var(--fg)}
.icon.on{color:var(--accent)}
.icon[data-rep]::after{content:attr(data-rep);position:absolute;right:6px;top:5px;font-size:9px;font-weight:800}

/* page heads */
.head{display:flex;gap:22px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}
.head .big{width:min(176px,42vw);flex:none}
.head .big .cover{font-size:64px;border-radius:12px;box-shadow:0 12px 30px var(--shadow)}
.head>div:last-child{flex:1;min-width:200px}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:700;color:var(--muted)}
.title-in{background:none;border:0;border-bottom:2px solid transparent;color:var(--fg);font:800 clamp(28px,4.5vw,44px)/1.1 var(--font);letter-spacing:-.035em;padding:2px 0;width:100%;min-width:0;border-radius:0}
.title-in:focus{outline:0;border-bottom-color:var(--accent)}
.head h1{margin:2px 0 6px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}
.fab:hover{filter:brightness(1.08)}

/* search */
.searchbox{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:999px;padding:0 18px;margin-bottom:16px;max-width:520px;color:var(--muted)}
.searchbox:focus-within{outline:2px solid var(--accent)}
.searchbox input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:16px var(--font);padding:13px 0;outline:0}

/* empty */
.empty{max-width:440px;margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty p{color:var(--muted);margin:0 0 10px}
.empty .hint{font-size:13px;margin-top:10px}

.row .sdur{display:none;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;flex:none}
.np-grab{display:block;margin:2px auto 0;padding:12px 60px 14px;background:none;border:0;cursor:pointer}
.np-grab i{display:block;width:42px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--fg) 28%,transparent)}
.np-in{gap:18px;padding-top:4px}
#npCover{width:min(100%,380px);margin:8px auto 6px}
#npCover .cover{aspect-ratio:1;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.np-title{gap:8px;align-items:center;margin-top:6px}
.np-title .meta b{font-size:24px;font-weight:750;line-height:1.15;white-space:normal}
.np-title .meta small{font-size:19px;color:var(--muted);margin-top:2px}
.np .icon.round{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--fg) 14%,transparent);display:grid;place-items:center;flex:none}
.np .icon.round svg{width:22px;height:22px}
.np .seek{display:grid;grid-template-columns:1fr 1fr;gap:2px 0;max-width:none;margin-top:4px}
.np .seek input{grid-column:1/-1}
.np .seek span:first-of-type{text-align:left;min-width:0}.np .seek span:last-of-type{text-align:right;min-width:0}
.np input[type=range]{height:22px}
.np input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px}
.np input[type=range]::-webkit-slider-thumb{width:0;height:0;margin-top:0;opacity:0}
.np .ctrls.main{justify-content:center;gap:clamp(26px,9vw,52px);margin:6px 0 2px}
.np .ctrls.main .icon{width:60px;height:60px}
.np .ctrls.main .icon svg{width:38px;height:38px}
.np .playbtn{width:92px;height:92px;background:none;box-shadow:none;color:var(--fg);border-radius:50%;display:grid;place-items:center}
.np .playbtn svg{width:64px;height:64px}
.npvol{display:grid;grid-template-columns:22px 1fr 22px;align-items:center;gap:12px;color:var(--muted);margin:4px 2px}
.npvol svg{width:20px;height:20px}
.np-bottom{display:flex;justify-content:space-around;align-items:center;padding:6px 18px 0;color:var(--muted)}
.np-bottom .icon{width:50px;height:50px;border-radius:50%}
.np-bottom .icon svg{width:26px;height:26px}
.np-bottom .icon.on{color:var(--accent);background:color-mix(in srgb,var(--fg) 12%,transparent)}
@media (max-width:760px){
  .row{--ins:92px;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;padding:11px 6px;contain-intrinsic-size:auto 86px;align-items:center}
  .row .idx,.row .dur,.row .icon.like{display:none!important}
  .row .cover.sm{width:64px;border-radius:10px}
  .row .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
  .row .meta b{font-size:17px;font-weight:650;line-height:1.2}
  .row .meta .sub small{font-size:14.5px}
  .row .sdur{display:block}
  .row .icon{width:40px;height:40px;color:var(--muted)}
  .row::after{left:var(--ins)}
}

/* v1.4: artists, slide animations, draggable player */
@keyframes vin-r{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}
@keyframes vin-l{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}
#main.vin-r{animation:vin-r .36s cubic-bezier(.22,.9,.24,1)}
#main.vin-l{animation:vin-l .36s cubic-bezier(.22,.9,.24,1)}
.alist{display:flex;flex-direction:column}
.alpha{padding:14px 4px 4px;font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--accent)}
.arow{display:grid;grid-template-columns:60px minmax(0,1fr) 20px;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 4px;cursor:pointer;position:relative;color:inherit;content-visibility:auto;contain-intrinsic-size:auto 78px}
.arow .cover{width:60px;border-radius:50%}
.arow::after{content:"";position:absolute;left:78px;right:4px;bottom:0;height:1px;background:color-mix(in srgb,var(--fg) 11%,transparent)}
.arow .meta b{font-size:17px;font-weight:650}
.arow .meta small{font-size:14px}
.arow .chev{width:18px;height:18px;color:var(--muted);opacity:.7}
.arow:hover,.arow:active{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.back{display:inline-flex;align-items:center;background:none;border:0;color:var(--accent);font-weight:650;font-size:16px;padding:4px 0 10px;margin-left:-6px;cursor:pointer}
.back svg{width:24px;height:24px;fill:none}
.head .big .artav{border-radius:50%}
#np{overscroll-behavior:none;will-change:transform;touch-action:pan-y}
#np.drag{box-shadow:0 -12px 44px rgba(0,0,0,.45);overflow:hidden}
@keyframes coverin{from{transform:scale(.82);opacity:.4}to{transform:scale(1);opacity:1}}
#np.opening #npCover{animation:coverin .6s cubic-bezier(.2,.9,.22,1) both}
#npCover .cover{transition:transform .55s cubic-bezier(.2,.9,.22,1),box-shadow .55s}
body:not(.is-playing) #npCover .cover{transform:scale(.88);box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* v1.5 player: dark liquid-glass Now Playing */
#np{--fg:#fff;--muted:rgba(255,255,255,.58);--line:rgba(255,255,255,.26);--accent:#fff;color:#fff;background:#1a1a1c;overflow:hidden;isolation:isolate}
#npBg{position:absolute;inset:-25%;z-index:-2;background-size:cover;background-position:center;filter:blur(64px) saturate(1.8) brightness(.78);transform:translateZ(0);transition:background-image .4s}
#np::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(22,22,24,.38),rgba(22,22,24,.6) 55%,rgba(18,18,20,.82))}
#np .np-in{position:relative;height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-width:460px;padding:6px 26px calc(24px + env(safe-area-inset-bottom,0px));gap:0}
#np .np-grab{padding:10px 70px 12px}
#np .np-grab i{width:38px;height:5px;background:rgba(255,255,255,.38)}
#npCover{flex:1 0 auto;min-height:min(46vh,400px);display:flex;align-items:center;justify-content:center;width:100%;margin:0}
#npCover::before{display:none}
#npCover .cover{width:min(92%,380px);aspect-ratio:1/1;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07)}
#np .np-title{margin:14px 0 0;gap:2px}
#np .np-title .meta b{font-size:22px;font-weight:700;letter-spacing:-.01em;color:#fff}
#np .np-title .meta small{font-size:22px;font-weight:500;color:rgba(255,255,255,.55);margin:0}
#np .np-title .meta small.lic{font-size:12px;margin-top:3px}
#np .icon.round{width:40px;height:40px;background:none;color:#fff;backdrop-filter:none}
#np .icon.round svg{width:24px;height:24px}
#np .seek{margin-top:26px;gap:6px 0}
#np .seek span{font-size:12px;font-weight:600;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
#np input[type=range]{height:28px}
#np input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,rgba(255,255,255,.66) var(--p),rgba(255,255,255,.24) var(--p))}
#np input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:rgba(255,255,255,.24)}
#np input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:rgba(255,255,255,.66)}
#np .ctrls.main{margin:14px 0 18px;gap:clamp(34px,13vw,66px)}
#np .ctrls.main .icon{width:64px;height:64px;color:#fff}
#np .ctrls.main .icon svg{width:54px;height:54px}
#np .playbtn{width:84px;height:84px;color:#fff}
#np .playbtn svg{width:60px;height:60px}
#np .npvol{grid-template-columns:20px 1fr 24px;gap:14px;margin:4px 2px 18px;color:rgba(255,255,255,.55)}
#np .npvol svg{width:20px;height:20px;fill:currentColor}
#np .np-bottom{padding:4px 22px 6px;color:rgba(255,255,255,.55)}
#np .np-bottom .icon{width:54px;height:54px;color:rgba(255,255,255,.62)}
#np .np-bottom .icon.on{color:#fff;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.1)}
#np .np-bottom .icon:active{background:rgba(255,255,255,.14)}
#np h2{color:rgba(255,255,255,.55)}

/* v1.8 profile */
.profbtn{margin-top:auto;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:color-mix(in srgb,var(--fg) 7%,transparent);border:1px solid var(--line);border-radius:16px;padding:10px 12px;color:var(--fg);cursor:pointer}
.profbtn .pt{flex:1;min-width:0;display:flex;flex-direction:column}
.profbtn b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profbtn small{font-size:12px;color:var(--muted)}
.profbtn .chev{width:18px;height:18px;color:var(--muted)}
.avc{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;width:var(--s,44px);height:var(--s,44px);background:var(--panel2)}
.avc svg{width:68%;height:68%}
.avc img{width:100%;height:100%;object-fit:cover;display:block}
.phead{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 18px}
.phead .avc{--s:104px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.phead .nm{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;letter-spacing:-.02em;background:none;border:0;color:var(--fg);cursor:pointer}
.phead .nm svg{width:18px;height:18px;color:var(--muted)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px;max-width:460px;margin-top:12px}
.avgrid button{background:none;border:0;padding:4px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.avgrid .avc{--s:56px}
.avgrid button.on{outline:3px solid var(--accent);outline-offset:2px}
.prow{display:flex;gap:10px;flex-wrap:wrap}
/* v1.7 lock-screen style transport glyphs: soft rounded corners */
svg.tp path{stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
#np .playbtn svg,#np .ctrls.main .icon svg{overflow:visible}
/* v1.6 Apple-style glass controls */
#np .icon,#np .playbtn{transition:transform .18s cubic-bezier(.3,1.4,.5,1),background-color .18s;-webkit-tap-highlight-color:transparent}
#np .ctrls.main .icon,#np .playbtn{border-radius:50%}
#np .ctrls.main .icon:active,#np .playbtn:active,#np .icon.round:active{background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);transform:scale(.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
#np .icon.round{border-radius:50%}
#np input[type=range]::-webkit-slider-runnable-track{transition:height .2s cubic-bezier(.3,1.3,.5,1),box-shadow .2s}
#np input[type=range].hold::-webkit-slider-runnable-track{height:14px;border-radius:7px;box-shadow:0 0 0 .5px rgba(255,255,255,.12)}
#np .seek input.hold,#np .npvol input.hold{transform:scale(1.015)}
#np .np-bottom{justify-content:space-between}
#np .np-bottom .icon svg{width:27px;height:27px}
#np .np-bottom .icon.on svg{fill:#fff}
#np .np-top,#np .np-grab{position:relative}
@media (prefers-reduced-motion:reduce){#main.vin-r,#main.vin-l{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">

(()=>{

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const ICONS={
  play:'M7.5 5.5v13L18.5 12z',

/* ---------- tag reader: title, artist and cover art from mp3 (ID3) and m4a (MP4) files ---------- */
/*TAGS-START*/
function sniffMime(d,fallback){
  if(d[0]===0x89&&d[1]===0x50&&d[2]===0x4E&&d[3]===0x47)return 'image/png';
  if(d[0]===0xFF&&d[1]===0xD8)return 'image/jpeg';
  return fallback||'image/jpeg';
}
function id3Text(b,enc){
  if(enc===1||enc===2){
    let le=false,s=0;
    if(b[0]===0xFF&&b[1]===0xFE){s=2;le=true;}else if(b[0]===0xFE&&b[1]===0xFF){s=2;le=false;}
    return new TextDecoder(le?'utf-16le':'utf-16be').decode(b.subarray(s)).replace(/\0+$/,'').trim();
  }
  return new TextDecoder(enc===3?'utf-8':'iso-8859-1').decode(b).replace(/\0+$/,'').trim();
}
function parseAPIC(d,ver){
  const enc=d[0];let p=1,mime='image/jpeg';
  if(ver===2){mime=String.fromCharCode(d[1],d[2],d[3]).toLowerCase()==='png'?'image/png':'image/jpeg';p=4;}
  else{
    let e=p;while(e<d.length&&d[e]!==0)e++;
    const m=String.fromCharCode.apply(null,d.subarray(p,e));
    mime=m.includes('/')?m:'image/jpeg';p=e+1;
  }
  p+=1;
  if(enc===1||enc===2){while(p+1<d.length&&!(d[p]===0&&d[p+1]===0))p+=2;p+=2;}
  else{while(p<d.length&&d[p]!==0)p++;p+=1;}
  const data=d.subarray(p);
  if(data.length<100)return null;
  return {mime:sniffMime(data,mime),data};
}
async function readID3(file){
  const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
  const ver=head[3],flags=head[5];
  const size=((head[6]&127)<<21)|((head[7]&127)<<14)|((head[8]&127)<<7)|(head[9]&127);
  const buf=new Uint8Array(await file.slice(10,10+size).arrayBuffer());
  let p=0;
  if(flags&0x40&&buf.length>4){
    p=ver===4?(((buf[0]&127)<<21)|((buf[1]&127)<<14)|((buf[2]&127)<<7)|(buf[3]&127)):(((buf[0]<<24)|(buf[1]<<16)|(buf[2]<<8)|buf[3])+4);
  }
  const idLen=ver===2?3:4,hdrLen=ver===2?6:10,out={};
  while(p+hdrLen<=buf.length){
    const id=String.fromCharCode.apply(null,buf.subarray(p,p+idLen));
    if(!/^[A-Z0-9]+$/.test(id))break;
    let fs;
    if(ver===2)fs=(buf[p+3]<<16)|(buf[p+4]<<8)|buf[p+5];
    else if(ver===4)fs=((buf[p+4]&127)<<21)|((buf[p+5]&127)<<14)|((buf[p+6]&127)<<7)|(buf[p+7]&127);
    else fs=buf[p+4]*16777216+((buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7]);
    const d=buf.subarray(p+hdrLen,p+hdrLen+fs);
    p+=hdrLen+fs;
    if(!fs)continue;
    if(id==='TIT2'||id==='TT2')out.title=id3Text(d.subarray(1),d[0]);
    else if(id==='TPE1'||id==='TP1')out.artist=id3Text(d.subarray(1),d[0]);
    else if(id==='TALB'||id==='TAL')out.album=id3Text(d.subarray(1),d[0]);
    else if((id==='APIC'||id==='PIC')&&!out.picture){const pic=parseAPIC(d,ver);if(pic)out.picture=pic;}
  }

}
function mp4Kids(buf,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    const size=((buf[p]<<24)|(buf[p+1]<<16)|(buf[p+2]<<8)|buf[p+3])>>>0;
    const type=String.fromCharCode(buf[p+4],buf[p+5],buf[p+6],buf[p+7]);
    if(size<8||p+size>end)break;
    out.push({type,s:p+8,e:p+size});p+=size;
  }
  return out;
}
function parseMoov(buf){
  const udta=mp4Kids(buf,0,buf.length).find(k=>k.type==='udta');if(!udta)return null;
  const meta=mp4Kids(buf,udta.s,udta.e).find(k=>k.type==='meta');if(!meta)return null;
  const ilst=mp4Kids(buf,meta.s+4,meta.e).find(k=>k.type==='ilst');if(!ilst)return null;
  const out={},utf8=b=>new TextDecoder('utf-8').decode(b).trim();
  for(const it of mp4Kids(buf,ilst.s,ilst.e)){
    const dat=mp4Kids(buf,it.s,it.e).find(k=>k.type==='data');if(!dat)continue;
    const payload=buf.subarray(dat.s+8,dat.e);
    if(it.type==='\xA9nam')out.title=utf8(payload);
    else if(it.type==='\xA9ART')out.artist=utf8(payload);
    else if(it.type==='\xA9alb')out.album=utf8(payload);
    else if(it.type==='covr'&&!out.picture&&payload.length>100)out.picture={mime:sniffMime(payload,'image/jpeg'),data:payload};
  }

}
async function readMP4(file){
  let off=0;const end=file.size;
  while(off+8<=end){
    const h=new DataView(await file.slice(off,off+16).arrayBuffer());
    let size=h.getUint32(0),hl=8;
    const type=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
    if(size===1){size=h.getUint32(8)*4294967296+h.getUint32(12);hl=16;}else if(size===0)size=end-off;
    if(size<8)break;
    if(type==='moov'){
      if(size>60e6)return null;
      return parseMoov(new Uint8Array(await file.slice(off+hl,off+size).arrayBuffer()));
    }
    off+=size;
  }
  return null;
}
async function readTags(file){
  try{
    const h=new Uint8Array(await file.slice(0,12).arrayBuffer());
    if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33)return (await readID3(file))||{};
    if(String.fromCharCode(h[4],h[5],h[6],h[7])==='ftyp')return (await readMP4(file))||{};
  }catch(e){}
  return {};
}
/*TAGS-END*/

/* ---------- import ---------- */
function readDuration(file){
  return new Promise(res=>{
    const a=new Audio(),u=URL.createObjectURL(file);let done=false;
    const fin=d=>{if(done)return;done=true;URL.revokeObjectURL(u);res(d);};
    a.preload='metadata';
    a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0);
    a.onerror=()=>fin(0);
    setTimeout(()=>fin(0),3000);
    a.src=u;
  });
}
let importing=false,cancelImport=false,fillingDur=false;
const durFail=new Set();
const AUDIO_RE=/\.(mp3|m4a|aac|flac|wav|ogg|opus|weba)$/i;
function putBatch(items){
  return new Promise((res,rej)=>{
    const t=db.transaction(['blobs','tracks'],'readwrite');
    items.forEach(x=>{t.objectStore('blobs').put({id:x.t.id,blob:x.f});t.objectStore('tracks').put(x.t);});
    t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
function impUI(done,total){
  $('#imp').hidden=false;
  $('#impText').textContent='Adding '+done+' of '+total;
  $('#impFill').style.width=(total?done/total*100:0)+'%';
}
async function importFiles(files){
  if(importing){toast('Still adding songs');return;}
  const picked=[...files].filter(f=>(f.type&&f.type.startsWith('audio/'))||AUDIO_RE.test(f.name));
  if(!picked.length){toast('No audio files found');return;}
  const known=new Set(tracks.map(t=>t.key));
  const list=picked.filter(f=>!known.has(f.name+'|'+f.size));
  if(!list.length){toast('Already in your library');return;}
  importing=true;cancelImport=false;impUI(0,list.length);
  const t0=Date.now();let n=0,why='';
  try{
    for(let i=0;i<list.length&&!cancelImport;i+=8){
      const chunk=list.slice(i,i+8);
      const items=await Promise.all(chunk.map(async(f,j)=>{
        const tg=await readTags(f);
        const base=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
        let artist='Unknown artist',title=base;
        const m=base.match(/^(.+?)\s+-\s+(.+)$/);
        if(m){artist=m[1].trim();title=m[2].trim();}
        if(tg.title)title=tg.title;
        if(tg.artist)artist=tg.artist;
        return {f,t:{id:uid(),key:f.name+'|'+f.size,title,artist,album:tg.album||'',duration:0,added:t0+i+j,liked:false,art:tg.picture?new Blob([tg.picture.data],{type:tg.picture.mime}):null}};
      }));
      try{await putBatch(items);}catch(e){why='storage';break;}
      items.forEach(x=>tracks.push(x.t));
      n+=items.length;impUI(n,list.length);
      await new Promise(r=>setTimeout(r,0));
    }
  }finally{importing=false;$('#imp').hidden=true;}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(_){}
  if(why==='storage')toast('Not enough storage. '+n+' songs were added.');
  else if(cancelImport)toast('Stopped. '+n+' songs were added.');
  else toast(n+(n===1?' song added':' songs added'));
  render(true);
  fillDurations();
}
async function fillDurations(){
  if(fillingDur)return;fillingDur=true;
  try{
    for(const t of tracks.slice()){
      if(importing)break;
      if(t.duration||durFail.has(t.id))continue;
      let blob=null;try{blob=await getBlob(t.id);}catch(_){}
      if(!blob){durFail.add(t.id);continue;}
      const d=await readDuration(blob);
      if(d){
        t.duration=d;try{await put('tracks',t);}catch(_){}
        $$('.row[data-id="'+t.id+'"] .dur,.row[data-id="'+t.id+'"] .sdur').forEach(el=>{el.textContent=fmt(d);});
      }else durFail.add(t.id);
      await new Promise(r=>setTimeout(r,30));
    }
  }finally{fillingDur=false;}
}

function rowHtml(list,a,b){
  let h='';
  for(let i=a;i<b;i++){const t=list[i];
    h+=`<div class="row${t.id===curId?' cur':''}" data-i="${i}" data-id="${t.id}" role="listitem" tabindex="0">
    <div class="idx"><span class="n">${i+1}</span><span class="pl">${ic('play')}</span><span class="eq"><i></i><i></i><i></i></span></div>
    ${cover(t,'sm')}
    <div class="meta"><b>${esc(t.title)}</b><div class="sub"><small>${esc(t.artist)}</small><span class="sdur">${t.duration?fmt(t.duration):''}</span></div></div>
    <button class="icon like${t.liked?' on':''}" data-act="like" aria-label="Like" aria-pressed="${t.liked}">${ic(t.liked?'heartfill':'heart')}</button>
    <span class="dur">${t.duration?fmt(t.duration):''}</span>
    <button class="icon" data-act="more" aria-label="More options">${ic('more')}</button>
  </div>`;}
  return h;
}
function rows(list){
  curList=list.map(t=>t.id);
  if(!list.length)return '';
  rowQ={list,at:Math.min(ROWS_FIRST,list.length)};
  return '<div class="rows" role="list">'+rowHtml(list,0,rowQ.at)+'</div>';
}
function flushRows(){
  const q=rowQ;rowQ=null;
  if(!q||q.at>=q.list.length)return;
  const box=document.querySelector('#main .rows');if(!box)return;
  const tok=++rowTok;
  const step=()=>{
    if(tok!==rowTok||!box.isConnected)return;
    const b=Math.min(q.at+80,q.list.length);
    box.insertAdjacentHTML('beforeend',rowHtml(q.list,q.at,b));q.at=b;
    if(q.at<q.list.length)idle(step);
  };
  requestAnimationFrame(()=>idle(step));
}
function emptyState(){
  return `<div class="empty"><div class="vinyl"></div><h1>Your library is empty</h1><p>Add songs from your device. They are saved inside this app, so they play with no connection and no ads.</p><button class="primary" data-act="add">Add music</button><p class="hint">Songs from another app: share or export them to the Files app first, then pick them here. You can also drag audio files onto this window.</p></div>`;
}
const sortedBy=k=>{
  const a=[...tracks];
  if(k==='title')a.sort((x,y)=>x.title.localeCompare(y.title,undefined,{sensitivity:'base'}));
  else if(k==='artist')a.sort((x,y)=>x.artist.localeCompare(y.artist,undefined,{sensitivity:'base'})||x.title.localeCompare(y.title,undefined,{sensitivity:'base'}));
  else a.sort((x,y)=>y.added-x.added);
  return a;
};

function searchResults(){
  const q=view.q.trim().toLowerCase();
  if(!q)return `<p class="muted pad">Type to search your ${tracks.length} ${tracks.length===1?'song':'songs'}.</p>`;
  const res=tracks.filter(t=>(t.title+' '+t.artist+' '+(t.album||'')).toLowerCase().includes(q));
  return res.length?rows(res):`<p class="muted pad">Nothing matches “${esc(view.q)}”.</p>`;
}

/* ---------- artists: every artist becomes a page, like a playlist ---------- */
const normA=a=>(a||'').trim().toLowerCase();
function artistGroups(){
  const m=new Map();
  for(const t of tracks){
    const k=normA(t.artist)||'unknown artist';
    let a=m.get(k);if(!a){a={key:k,name:(t.artist||'').trim()||'Unknown artist',tracks:[]};m.set(k,a);}
    a.tracks.push(t);
  }
  return [...m.values()].sort((x,y)=>x.name.localeCompare(y.name,undefined,{sensitivity:'base'}));
}
const artistCover=a=>cover(a.tracks.find(x=>x.art)||a.tracks[0],'artav');
const CHEV_L='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function vArtists(){
  if(!tracks.length)return emptyState();
  const g=artistGroups();let last='',h='';
  for(const a of g){
    const c=(a.name.normalize('NFD')[0]||'#').toUpperCase(),L=/[A-Z]/.test(c)?c:'#';
    if(L!==last){h+=`<div class="alpha">${L}</div>`;last=L;}
    h+=`<button class="arow" data-go="artist" data-id="${esc(a.key)}">${artistCover(a)}<span class="meta"><b>${esc(a.name)}</b><small>${a.tracks.length} ${a.tracks.length===1?'song':'songs'}</small></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  }
  return `<div class="sec-h"><h1>Artists <span class="count">${g.length}</span></h1></div><div class="alist">${h}</div>`;
}
function vArtist(){
  const a=artistGroups().find(x=>x.key===view.id);
  if(!a)return `<button class="back" data-go="artists">${CHEV_L}Artists</button><p class="muted pad">That artist is not in your library any more.</p>`;
  const list=a.tracks.slice().sort((x,y)=>(x.album||'').localeCompare(y.album||'',undefined,{sensitivity:'base'})||x.title.localeCompare(y.title,undefined,{sensitivity:'base'}));
  const total=list.reduce((s,t)=>s+(t.duration||0),0);
  return `<button class="back" data-go="artists">${CHEV_L}Artists</button>
  <div class="head"><div class="big">${artistCover(a)}</div><div><div class="eyebrow">Artist</div><h1>${esc(a.name)}</h1><div class="muted">${list.length} ${list.length===1?'song':'songs'}${total?' · '+fmtLong(total):''}</div></div></div>

  ${rows(list)}`;
}

const ICON_SHAPES=[{id:'lyre',name:'Lyre'},{id:'disc',name:'Vinyl'},{id:'note',name:'Notes'},{id:'phones',name:'Phones'},{id:'wave',name:'Wave'},{id:'bars',name:'Bars'},{id:'cassette',name:'Tape'},{id:'mic',name:'Mic'},{id:'heart',name:'Heart'},{id:'orbit',name:'Orbit'},{id:'pulse',name:'Pulse'},{id:'ring',name:'Play'}];

const hex6=h=>/^#[0-9a-f]{6}$/i.test(h||'')?h:null;
const mixHex=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('');};
const cssVar=n=>{try{return hex6(getComputedStyle(document.documentElement).getPropertyValue(n).trim());}catch(_){return null;}};
const getPref=(k,d)=>{try{return localStorage.getItem(k)||d;}catch(_){return d;}};

function iconPalette(id){

  const a=cssVar('--accent')||'#ff7b3a';
  return {bg:cssVar('--bg')||'#15121f',a,f:cssVar('--fg')||'#f4f0fc',g:cssVar('--accent2')||a};
}
function drawIcon(shape,pal,S,look){
  look=look||'dark';
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),u=S/100;
  let P={a:pal.a,f:pal.f};
  const gradBg=(c0,c1)=>{const lg=g.createLinearGradient(0,0,S,S);lg.addColorStop(0,c0);lg.addColorStop(1,c1);g.fillStyle=lg;g.fillRect(0,0,S,S);};
  if(look==='bright'){gradBg(mixHex(pal.a,'#ffffff',.12),mixHex(pal.g||pal.a,'#000000',.12));P={a:'#ffffff',f:'rgba(255,255,255,.7)'};}
  else{
    gradBg(mixHex(pal.bg,'#ffffff',.14),mixHex(pal.bg,'#000000',.2));
    if(look==='badge'){
      const lg=g.createLinearGradient(10*u,10*u,90*u,90*u);lg.addColorStop(0,pal.a);lg.addColorStop(1,pal.g||pal.a);
      g.fillStyle=lg;g.beginPath();g.arc(50*u,50*u,41*u,0,Math.PI*2);g.fill();
      P={a:'#0c0a12',f:'rgba(12,10,18,.55)'};
      g.translate(50*u,50*u);g.scale(.64,.64);g.translate(-50*u,-50*u);
    }
  }
  g.lineCap='round';g.lineJoin='round';
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo((x+r)*u,y*u);g.arcTo((x+w)*u,y*u,(x+w)*u,(y+h)*u,r*u);g.arcTo((x+w)*u,(y+h)*u,x*u,(y+h)*u,r*u);g.arcTo(x*u,(y+h)*u,x*u,y*u,r*u);g.arcTo(x*u,y*u,(x+w)*u,y*u,r*u);g.closePath();};
  const circ=(x,y,r)=>{g.beginPath();g.arc(x*u,y*u,r*u,0,Math.PI*2);};
  if(shape==='lyre'){
    g.strokeStyle=P.a;g.lineWidth=6*u;
    g.beginPath();g.moveTo(30*u,26*u);g.bezierCurveTo(19*u,38*u,21*u,58*u,37*u,64*u);g.stroke();
    g.beginPath();g.moveTo(70*u,26*u);g.bezierCurveTo(81*u,38*u,79*u,58*u,63*u,64*u);g.stroke();
    g.beginPath();g.moveTo(26*u,26*u);g.lineTo(74*u,26*u);g.stroke();
    g.fillStyle=P.a;g.beginPath();g.moveTo(34*u,58*u);g.quadraticCurveTo(34*u,83*u,50*u,83*u);g.quadraticCurveTo(66*u,83*u,66*u,58*u);g.closePath();g.fill();
    g.strokeStyle=P.f;g.lineWidth=2.6*u;
    [38,44,50,56,62].forEach((x,i)=>{g.beginPath();g.moveTo(x*u,30*u);g.lineTo(x*u,(i===2?60:58)*u);g.stroke();});
  }else if(shape==='disc'){
    circ(50,50,36);g.fillStyle='#0d0a14';g.fill();
    g.strokeStyle='rgba(255,255,255,.16)';g.lineWidth=1*u;
    [29,23].forEach(r=>{circ(50,50,r);g.stroke();});
    circ(50,50,12);g.fillStyle=P.a;g.fill();
    circ(50,50,2.4);g.fillStyle='#0d0a14';g.fill();
    g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=2*u;g.beginPath();g.arc(50*u,50*u,32*u,-2.5,-1.7);g.stroke();
  }else if(shape==='bars'){
    [28,46,62,40,24].forEach((h,i)=>{rr(15.5+i*15,50-h/2,9,h,4.5);g.fillStyle=i===2?P.f:P.a;g.fill();});
  }else if(shape==='wave'){
    [[P.a,1,6,18,0],[P.f,.9,4.5,14,1.2],[P.a,.45,3.5,10,2.4]].forEach(([col,al,w,amp,ph])=>{
      g.beginPath();
      for(let x=14;x<=86;x++){const y=50+Math.sin((x-14)/72*Math.PI*2+ph)*amp;if(x===14)g.moveTo(x*u,y*u);else g.lineTo(x*u,y*u);}
      g.strokeStyle=col;g.globalAlpha=al;g.lineWidth=w*u;g.stroke();g.globalAlpha=1;
    });
  }else if(shape==='note'){
    g.fillStyle=P.a;
    [[34,70],[66,64]].forEach(([x,y])=>{g.save();g.translate(x*u,y*u);g.rotate(-.35);g.beginPath();g.ellipse(0,0,10*u,7.5*u,0,0,Math.PI*2);g.fill();g.restore();});
    rr(41.5,30,5,40,2);g.fill();rr(73.5,24,5,40,2);g.fill();
    g.beginPath();g.moveTo(41.5*u,30*u);g.lineTo(78.5*u,24*u);g.lineTo(78.5*u,35*u);g.lineTo(41.5*u,41*u);g.closePath();g.fillStyle=P.f;g.fill();
  }else if(shape==='phones'){
    g.strokeStyle=P.f;g.lineWidth=7*u;g.beginPath();g.arc(50*u,54*u,27*u,Math.PI,0);g.stroke();
    g.fillStyle=P.a;rr(17,52,15,26,6);g.fill();rr(68,52,15,26,6);g.fill();
  }else if(shape==='cassette'){
    g.strokeStyle=P.a;g.lineWidth=5*u;rr(13,28,74,46,7);g.stroke();
    g.fillStyle=P.f;rr(21,35,58,9,3);g.fill();
    circ(36,59,6);g.strokeStyle=P.a;g.lineWidth=4*u;g.stroke();circ(64,59,6);g.stroke();
    g.fillStyle=P.a;rr(40,55,20,8,4);g.fill();
  }else if(shape==='mic'){
    g.fillStyle=P.a;rr(39,16,22,38,11);g.fill();
    g.strokeStyle=P.f;g.lineWidth=2.4*u;[28,34,40].forEach(y=>{g.beginPath();g.moveTo(44*u,y*u);g.lineTo(56*u,y*u);g.stroke();});
    g.strokeStyle=P.a;g.lineWidth=5*u;g.beginPath();g.arc(50*u,44*u,19*u,.12,Math.PI-.12);g.stroke();
    g.beginPath();g.moveTo(50*u,63*u);g.lineTo(50*u,79*u);g.moveTo(38*u,80*u);g.lineTo(62*u,80*u);g.stroke();
  }else if(shape==='heart'){

function mixIds(ids,mode,lastId){

    const groups=new Map();
    a.forEach(id=>{const t=byId(id),k=((t&&t.artist)||'').toLowerCase();let g=groups.get(k);if(!g){g=[];groups.set(k,g);}g.push(id);});

/* lock-screen artwork: embedded cover if the file has one, otherwise a generated cover */
const artCache=new Map();
function drawCover(t){return window.Covers?Covers.make(t,512,covStyle()):'';}
async function artworkFor(t){
  if(artCache.has(t.id))return artCache.get(t.id);
  let url=null;
  if(t.art){
    /* always a centred square: wide or tall covers are cropped, never squashed or shown as a rectangle */
    const toSquare=(src,w,h)=>{
      const side=Math.min(w,h),sx=(w-side)/2,sy=(h-side)/2,out=Math.max(1,Math.min(512,side));
      const c=document.createElement('canvas');c.width=c.height=out;
      const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,out,out);
      g.drawImage(src,sx,sy,side,side,0,0,out,out);
      return c.toDataURL('image/jpeg',.9);
    };
    try{const bmp=await createImageBitmap(t.art);url=toSquare(bmp,bmp.width,bmp.height);}
    catch(e){
      try{
        const u=URL.createObjectURL(t.art);
        const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u;});
        url=toSquare(img,img.naturalWidth,img.naturalHeight);URL.revokeObjectURL(u);
      }catch(_){}
    }
  }
  if(!url)url=drawCover(t);
  artCache.set(t.id,url);return url;
}
function artSync(t){
  if(artCache.has(t.id))return artCache.get(t.id);
  if(!t.art){const u=drawCover(t);artCache.set(t.id,u);return u;}
  return null;
}

const artType=src=>src.startsWith('data:image/png')?'image/png':'image/jpeg';

/* Volume. iPhone ignores audio.volume, so the slider drives a Web Audio gain instead (only switched on the first time you touch it). */
const volOk=(()=>{try{const a=new Audio();a.volume=.5;return a.volume===.5;}catch(_){return false;}})();
let actx=null,gainNode=null;
function ensureGain(){
  if(gainNode)return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    actx=new AC();
    const src=actx.createMediaElementSource(audio);
    gainNode=actx.createGain();src.connect(gainNode);gainNode.connect(actx.destination);
    return true;
  }catch(e){actx=null;gainNode=null;return false;}
}

function setVol(v,touched){

    else if(!volWarned){volWarned=true;toast('Use the side volume buttons on this device');}
  }
  ['#vol','#npVol'].forEach(q=>{const el=$(q);if(el){el.value=v;el.style.setProperty('--p',v+'%');}});

    else{np.style.transition='transform .38s cubic-bezier(.2,1.1,.3,1)';np.style.transform='translateY(0)';setTimeout(()=>{np.style.transition='';np.style.transform='';np.style.borderRadius='';np.classList.remove('drag');},400);}
  };
  np.addEventListener('touchend',end,{passive:true});np.addEventListener('touchcancel',end,{passive:true});

/* swipe left and right to move between tabs; swipe right on an artist or playlist to go back */
(()=>{
  const m=$('#main');let x0=0,y0=0,t0=0,ok=false;
  m.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ok=false;return;}
    const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();
    ok=x0>22&&!e.target.closest('input,select,textarea')&&!document.body.classList.contains('kb')&&$('#drawer').hidden&&$('#np').hidden&&$('#modal').hidden;
  },{passive:true});
  m.addEventListener('touchend',e=>{
    if(!ok)return;ok=false;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.55||Date.now()-t0>800)return;
    const p=PARENT[view.n];
    if(p){if(dx>0)go(p);return;}
    const i=TABS.indexOf(view.n);if(i<0)return;
    const j=dx<0?i+1:i-1;
    if(j>=0&&j<TABS.length)go(TABS[j]);
  },{passive:true});
})();
/* Lock screen / Control Center buttons. iPhone only shows Previous and Next when those two are set and
   the 10-second skip buttons are NOT. They are set again every time a song starts, because iPhone can drop them. */
function bindLock(){
  if(!('mediaSession' in navigator))return;
  const h=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f);}catch(_){}};
  h('play',()=>{audio.play().catch(()=>{});});
  h('pause',()=>{audio.pause();});
  h('previoustrack',()=>{prev();});
  h('nexttrack',()=>{next(false);});
  h('seekbackward',null);h('seekforward',null);h('stop',null);
  h('seekto',d=>{if(d&&d.seekTime!=null&&isFinite(d.seekTime))audio.currentTime=d.seekTime;});
}
bindLock();
audio.addEventListener('playing',bindLock);
audio.addEventListener('loadedmetadata',bindLock);
/* the on-screen keyboard: hide the floating bars while typing so they never jump */

document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!a||!/INPUT|TEXTAREA/.test(a.tagName))document.body.classList.remove('kb');},120);});

/* ---------- updates: a new version waits quietly until you tap Update ---------- */
let swReg=null,applying=false,lastUpd=0;
function showUpdate(){const b=$('#upd');if(b&&b.hidden){b.hidden=false;toast('A new version is ready. Tap Update.');}}
function applyUpdate(silent){
  if(applying)return;applying=true;
  const b=$('#upd');if(b&&!silent){b.classList.add('busy');b.querySelector('span').textContent='Updating…';}
  setPref('orpheus-justupdated','1');
  const w=swReg&&swReg.waiting;
  if(w)w.postMessage('SKIP_WAITING');else{location.reload();return;}
  setTimeout(()=>location.reload(),6000);
}
async function checkUpdate(){
  const st=$('#updStat');if(st)st.textContent='Checking…';
  let msg='';
  try{
    if(!swReg)msg='Updates work once ORPHEUS is opened from its web address.';
    else{
      await swReg.update();
      await new Promise(r=>setTimeout(r,1500));
      msg=(swReg.waiting||swReg.installing)?'A new version is ready. Tap Update at the top.':'You have the latest version.';
    }
  }catch(_){msg='Could not reach the server. Try again when you are online.';}
  const s2=$('#updStat');if(s2)s2.textContent=msg;
}
function swInit(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  /* Coming from the old Offbeat app: apply once, silently. Every update after that waits for the Update button. */
  let migrating=!getPref('orpheus-sw','')&&!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    const seen=()=>{if(!navigator.serviceWorker.controller)return;if(migrating){migrating=false;applyUpdate(true);}else showUpdate();};
    if(reg.waiting)seen();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed')seen();});});
    setPref('orpheus-sw','1');
    reg.update().catch(()=>{});
    const poll=()=>{if(Date.now()-lastUpd>30000){lastUpd=Date.now();reg.update().catch(()=>{});}};
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
    setInterval(poll,30*60*1000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(applying)location.reload();});
}

/* ---------- your library in your Google account (Google Drive, hidden app folder) ---------- */
const G_SCOPE='https://www.googleapis.com/auth/drive.appdata';
const lsGet=(k,d='')=>{try{const v=localStorage.getItem(k);return v===null?d:v;}catch(_){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}};
const getTomb=()=>{try{return JSON.parse(lsGet('orpheus-tomb','[]'));}catch(_){return[];}};
function addTomb(id){const t=new Set(getTomb());t.add(id);lsSet('orpheus-tomb',JSON.stringify([...t]));}
const gRedirect=()=>location.origin+location.pathname.replace(/[^/]*$/,'');
let gMsg='',gBusy=false;
function gStat(m){gMsg=m;const el=$('#gStat');if(el)el.textContent=m;}
function gToken(){const t=lsGet('orpheus-gtok','');if(!t)return null;const[x,e]=t.split('|');return(+e>Date.now()+60000)?x:null;}
function gHandleReturn(){
  const m=/[#&]access_token=([^&]+)/.exec(location.hash||'');
  if(!m)return false;
  const st=/[#&]state=([^&]+)/.exec(location.hash)||[],ex=/[#&]expires_in=(\d+)/.exec(location.hash)||[];
  try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}
  if(!st[1]||st[1]!==lsGet('orpheus-gstate',''))return false;
  lsSet('orpheus-gtok',decodeURIComponent(m[1])+'|'+(Date.now()+(+ex[1]||3600)*1000));
  return true;
}
const G_CLIENT='682906234766-snd7f906greuahfrsuaiiua3t7dis1ad.apps.googleusercontent.com';
function gSignInRedirect(fresh){
  const s=Math.random().toString(36).slice(2)+Date.now().toString(36);lsSet('orpheus-gstate',s);lsSet('orpheus-gpending','1');
  const q={client_id:G_CLIENT,redirect_uri:gRedirect(),response_type:'token',scope:G_SCOPE,state:s,include_granted_scopes:'true'};
  if(fresh||!lsGet('orpheus-gconn',''))q.prompt='select_account';
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams(q);
}
function gSignOut(){
  ['orpheus-gtok','orpheus-gpending','orpheus-gconn','orpheus-glast'].forEach(k=>{try{localStorage.removeItem(k);}catch(_){}});
  gMsg='';toast('Signed out. Your songs stay on this device and in your Drive.');render(true);refreshProfileUI();
}
function gSwitch(){try{localStorage.removeItem('orpheus-gtok');}catch(_){}gSignInRedirect(true);}
function gStart(){if(gBusy){toast('Already syncing');return;}if(gToken())gRun();else gSignInRedirect();}
async function gf(url,opt={}){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+gToken()}});
  if(r.status===401){try{localStorage.removeItem('orpheus-gtok');}catch(_){}throw new Error('Sign in again to continue');}
  if(!r.ok){
    let why='';try{const j=await r.clone().json();why=(j.error&&(j.error.message||(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)))||'';}catch(_){}
    if(r.status===403&&/accessNotConfigured|has not been used|disabled/i.test(why))why='the Google Drive API is not turned on for this project';
    throw new Error('Google Drive '+r.status+(why?': '+String(why).slice(0,140):''));
  }
  return r;
}
async function gList(){
  let all=[],pt='';
  do{
    const j=await(await gf('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)'+(pt?'&pageToken='+encodeURIComponent(pt):''))).json();
    all=all.concat(j.files||[]);pt=j.nextPageToken;
  }while(pt);
  return all;
}
async function gUpload(name,blob,id){
  const type=blob.type||'application/octet-stream';
  const meta=JSON.stringify(id?{}:{name,parents:['appDataFolder']});
  let loc=null;
  try{
    const init=await gf('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=resumable&fields=id',{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':type},body:meta});
    loc=init.headers.get('Location');
  }catch(e){if(/Sign in again|Google Drive 40[13]/.test(e.message))throw e;}
  if(loc){
    const r=await fetch(loc,{method:'PUT',headers:{'Content-Type':type},body:blob});
    if(r.ok)return(await r.json()).id;
    if(r.status===401)throw new Error('Sign in again to continue');
  }
  /* fallback: one-shot upload */
  const bd='orpheus'+Math.random().toString(36).slice(2);
  const body=new Blob(['--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: '+type+'\r\n\r\n',blob,'\r\n--'+bd+'--']);
  const r2=await gf('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart&fields=id',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body});
  return(await r2.json()).id;
}
const gDown=id=>gf('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');
async function gRun(){
  if(gBusy)return;gBusy=true;
  const wl=(navigator.wakeLock&&navigator.wakeLock.request)?await navigator.wakeLock.request('screen').catch(()=>null):null;
  let up=0,down=0;
  try{
    gStat('Looking at your cloud library…');
    const files=await gList(),byName=new Map(files.map(f=>[f.name,f]));
    let remote={tracks:[],playlists:[],deleted:[]};
    const lf=byName.get('library.json');
    if(lf){try{remote=await(await gDown(lf.id)).json();}catch(_){}}
    remote.tracks=remote.tracks||[];remote.playlists=remote.playlists||[];remote.deleted=remote.deleted||[];
    const tomb=new Set([...remote.deleted,...getTomb()]);
    /* things you deleted on any device go everywhere */
    for(const id of [...tomb]){
      if(id.startsWith('p:')){const pid=id.slice(2);if(playlists.some(p=>p.id===pid)){playlists=playlists.filter(p=>p.id!==pid);try{await del('playlists',pid);}catch(_){}}}
      else if(byId(id))await deleteTrack(id,true);
    }
    const idMap=new Map();
    /* 1. send songs that are only on this device */
    const mine=tracks.filter(t=>!t.remote&&!byName.has('a-'+t.id));
    let n=0;
    for(const t of mine){
      gStat('Uploading '+(++n)+' of '+mine.length+': '+t.title);
      const blob=await getBlob(t.id);if(!blob||!blob.size)continue;
      byName.set('a-'+t.id,{id:await gUpload('a-'+t.id,blob)});
      if(t.art&&t.art.size)byName.set('c-'+t.id,{id:await gUpload('c-'+t.id,t.art)});
      up++;
    }
    /* 2. get songs that are only in the cloud */
    const need=remote.tracks.filter(rt=>!tomb.has(rt.id)&&byName.has('a-'+rt.id));
    const known=new Map(tracks.map(t=>[t.key,t]));
    const get=need.filter(rt=>{const k=known.get(rt.key);if(k){idMap.set(rt.id,k.id);return false;}return !byId(rt.id);});
    n=0;
    for(const rt of get){
      gStat('Downloading '+(++n)+' of '+get.length+': '+rt.title);
      const blob=await(await gDown(byName.get('a-'+rt.id).id)).blob();
      let art=null;const cf=byName.get('c-'+rt.id);
      if(cf){try{art=await(await gDown(cf.id)).blob();}catch(_){}}
      const t={...rt,art,remote:undefined};delete t.remote;
      await putBatch([{t,f:blob}]);tracks.push(t);known.set(t.key,t);down++;
    }
    /* 3. playlists: merge */
    for(const rp of remote.playlists){
      if(tomb.has('p:'+rp.id))continue;
      const ids=(rp.ids||[]).map(i=>idMap.get(i)||i).filter(i=>byId(i));
      const lp=playlists.find(p=>p.id===rp.id);
      if(lp){const u=[...new Set([...lp.ids,...ids])];if(u.length!==lp.ids.length){lp.ids=u;try{await put('playlists',lp);}catch(_){}}}
      else{const np={...rp,ids};playlists.push(np);try{await put('playlists',np);}catch(_){}}
    }
    /* 4. save the list of everything + clean up deleted songs in the cloud */
    gStat('Saving the list…');
    const lib={v:1,updated:Date.now(),deleted:[...tomb],
      tracks:tracks.filter(t=>!t.remote).map(t=>{const c={...t};delete c.art;return c;}),
      playlists:playlists.map(p=>({...p}))};
    await gUpload('library.json',new Blob([JSON.stringify(lib)],{type:'application/json'}),lf&&lf.id);
    for(const id of tomb){for(const pre of['a-','c-']){const f=byName.get(pre+id);if(f&&!id.startsWith('p:')){try{await gf('https://www.googleapis.com/drive/v3/files/'+f.id,{method:'DELETE'});}catch(_){}}}}
    lsSet('orpheus-glast',String(Date.now()));lsSet('orpheus-gconn','1');
    gStat('Done. '+up+' sent, '+down+' received. Last synced just now.');
    toast('Library synced');
  }catch(e){gStat('Stopped: '+(e&&e.message||'something went wrong')+'. Tap Sync again to continue where it stopped.');}
  finally{gBusy=false;try{wl&&wl.release();}catch(_){}render(true);}
}
function cloudBlock(){
  const on=!!gToken(),conn=!!lsGet('orpheus-gconn',''),last=+lsGet('orpheus-glast','0');
  const status=gMsg||(last?'Last synced '+new Date(last).toLocaleString():(on?'Signed in.':(conn?'Signed in before. Tap Sync to reconnect.':'Not signed in.')));
  return `<section><h2>Your library in your Google account</h2>
  <p class="muted" style="max-width:62ch;margin:0 0 10px">Keeps a copy of your songs, covers, likes and playlists in a hidden folder in your own Google Drive. After reinstalling ORPHEUS, sign in and tap Sync to bring everything back. Use Wi-Fi, because it uploads your music files. Deleting a song here also deletes it from the cloud copy.</p>
  <div class="prow"><button class="ghost" data-act="gSync">${on||conn?'Sync now':'Sign in with Google'}</button>${(on||conn)?'<button class="ghost" data-act="gSwitch">Use another account</button><button class="ghost" data-act="gOut">Sign out</button>':''}</div>
  <p class="muted" id="gStat" style="margin:10px 0 0">${esc(status)}</p></section>`;
}
